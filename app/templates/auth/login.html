<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · eMarket</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="kiosk d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="container" style="max-width:440px">
  <div class="text-center mb-4 text-white">
    <div class="display-5 fw-bold"><i class="bi bi-basket2-fill"></i> eMarket</div>
    <div class="opacity-75">Hệ thống quản lý chuỗi siêu thị</div>
  </div>
  <div class="card p-4">
    <h4 class="mb-3">Đăng nhập nhân viên</h4>
    {% for cat, m in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ cat }}">{{ m }}</div>{% endfor %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Tên đăng nhập</label>
        <input name="username" class="form-control form-control-lg" required autofocus></div>
      <div class="mb-3"><label class="form-label">Mật khẩu</label>
        <input name="password" type="password" class="form-control form-control-lg" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="rm">
        <label class="form-check-label ms-1" for="rm">Ghi nhớ đăng nhập</label></div>
      <button class="btn btn-success btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</button>
    </form>
  </div>
  <div class="d-flex gap-2 mt-3">
    <a href="{{ url_for('kiosk.index') }}" class="btn btn-light btn-lg flex-fill"><i class="bi bi-display"></i> Kiosk tra cứu</a>
    <a href="{{ url_for('portal.cua_hang') }}" class="btn btn-light btn-lg flex-fill"><i class="bi bi-shop"></i> Khách hàng</a>
  </div>
</div>
</body>
</html>
