{% extends 'layouts/base.html' %}
{% import 'macros.html' as m %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="mb-3">{{ m.tieu_de('Đổi mật khẩu', 'bi-key') }}</div>
<div class="card" style="max-width:480px"><div class="card-body">
  <form method="post">{{ m.csrf() }}
    <div class="mb-2"><label class="form-label">Mật khẩu hiện tại</label><input type="password" name="cu" class="form-control" required autocomplete="current-password"></div>
    <div class="mb-2"><label class="form-label">Mật khẩu mới</label><input type="password" name="moi" minlength="6" class="form-control" required autocomplete="new-password"></div>
    <div class="mb-3"><label class="form-label">Nhập lại mật khẩu mới</label><input type="password" name="nhap_lai" minlength="6" class="form-control" required autocomplete="new-password"></div>
    <button class="btn btn-success w-100"><i class="bi bi-check-lg"></i> Đổi mật khẩu</button>
  </form>
</div></div>
{% endblock %}
